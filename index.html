<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nardine Fakhreddine | Full Stack Developer & AI Engineer</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }

      body {
        background: #f5f5f5;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
      }

      .container {
        background: #fff;
        padding: 40px 30px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        max-width: 500px;
        width: 100%;
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 10px;
        color: #222;
      }

      h2 {
        font-size: 1.2rem;
        color: #555;
        margin-bottom: 25px;
      }

      p {
        font-size: 1rem;
        margin-bottom: 30px;
        line-height: 1.5;
      }

      .links a {
        text-decoration: none;
        color: #fff;
        background: #007bff;
        padding: 10px 20px;
        margin: 0 5px;
        border-radius: 8px;
        transition: background 0.3s;
        display: inline-block;
      }

      .links a:hover {
        background: #0056b3;
      }

      footer {
        margin-top: 30px;
        font-size: 0.9rem;
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <div class="container">

      <p>

        elegant solutions.
      </p>
      <div class="links">
        <a href="https://github.com/nardine-fakhreddine" target="_blank"
          >GitHub</a
        >

          href="https://www.linkedin.com/in/nardine-fakhreddine"
          target="_blank"

        >
        <!-- <a href="mailto:nardinefakhreddine@gmail.com">Email</a> -->
